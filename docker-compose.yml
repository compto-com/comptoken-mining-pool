services:
  public-pool:
    container_name: public-pool
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:${STRATUM_PORT}:${STRATUM_PORT}/tcp"
      - "0.0.0.0:${API_PORT}:${API_PORT}/tcp"
    volumes:
      - "./${SOLANA_CLUSTER}-DB:/public-pool/DB"
      - "./.env:/public-pool/.env:ro"
    environment:
      - NODE_ENV=production

